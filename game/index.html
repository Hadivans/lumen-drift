<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Lumen Drift — harvest the light, dodge the void</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #07031a;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    position: relative;
    line-height: 0;
  }
  canvas {
    display: block;
    cursor: crosshair;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(88, 40, 180, 0.45), 0 0 140px rgba(20, 140, 180, 0.25);
  }
  #mute-note {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    color: rgba(232, 246, 255, 0.6);
    font-size: 12px;
    line-height: 1.2;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="600"></canvas>
    <div id="mute-note"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
